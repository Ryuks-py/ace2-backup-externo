{% extends 'backup/base.html' %}
{% block content %}
<div style="max-width:360px;margin:60px auto;background:var(--card-bg);border:1px solid var(--border);border-radius:12px;padding:24px;">
    <h1 style="margin:0 0 16px;font-size:20px;">Entrar</h1>
    {% if form.errors %}<div class="msg error">Usuário ou senha inválidos.</div>{% endif %}
    <form method="post">{% csrf_token %}
        <label style="display:block;font-size:12px;font-weight:600;color:var(--text-muted);margin-bottom:12px;">Usuário
            <input name="username" autofocus required style="display:block;width:100%;margin-top:4px;padding:9px 12px;border:1.5px solid var(--border);border-radius:8px;font:inherit;"></label>
        <label style="display:block;font-size:12px;font-weight:600;color:var(--text-muted);margin-bottom:16px;">Senha
            <input name="password" type="password" required style="display:block;width:100%;margin-top:4px;padding:9px 12px;border:1.5px solid var(--border);border-radius:8px;font:inherit;"></label>
        <button type="submit" style="width:100%;padding:10px;border:0;border-radius:8px;background:#3f3f46;color:#fff;font:inherit;font-weight:600;cursor:pointer;">Entrar</button>
    </form>
</div>
{% endblock %}
